name: Update downloadable DMG

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'resources/**'
      - 'scripts/build-app.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Swift 6.2 toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Build Stash
        run: zsh scripts/build-app.sh
      - name: Create disk image
        run: |
          rm -f docs/downloads/Stash.dmg
          hdiutil create -volname Stash -srcfolder "$HOME/Applications/Stash.app" -ov -format UDZO docs/downloads/Stash.dmg
          hdiutil verify docs/downloads/Stash.dmg
      - name: Commit updated download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Stash.dmg
          git diff --cached --quiet || git commit -m "Update Stash DMG"
          git push
