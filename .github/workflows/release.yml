name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Swift 6.2 toolchain
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build Stash
        run: zsh scripts/build-app.sh

      - name: Create and verify disk image
        run: |
          mkdir -p release
          hdiutil create -volname Stash -srcfolder "$HOME/Applications/Stash.app" -ov -format UDZO release/Stash.dmg
          hdiutil verify release/Stash.dmg
          shasum -a 256 release/Stash.dmg > release/Stash.dmg.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="build-${GITHUB_SHA:0:7}"
          gh release create "$release_tag" \
            release/Stash.dmg \
            release/Stash.dmg.sha256 \
            --title "Stash $release_tag" \
            --generate-notes
